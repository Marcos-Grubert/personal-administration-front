<div class="dashboard-container">
  <app-sidebar></app-sidebar>

  <main class="main-content">
    <div class="content">
      <h2>Baixa de Contas à Receber</h2>
      <p class="subtitle">Selecione os títulos, defina o tipo de baixa e confirme a liquidação.</p>

      <div class="filter-container animate-fade">
        <form [formGroup]="filterForm" (ngSubmit)="searchTitles()" class="filter-form">
          
          <div class="filter-group">
            <label>Cliente</label>
            <select formControlName="customerId" class="form-control">
              <option [ngValue]="null">Todos os Clientes</option>
              <option *ngFor="let c of customers" [value]="c.id">{{ c.name }}</option>
            </select>
          </div>

          <div class="filter-group">
            <label>Data Inicial</label>
            <input type="date" formControlName="startDate" class="form-control">
          </div>

          <div class="filter-group">
            <label>Data Final</label>
            <input type="date" formControlName="endDate" class="form-control">
          </div>

          <button type="submit" class="btn-filter" [disabled]="!filterForm.valid">🔍 Filtrar</button>
        </form>
      </div>

      <div class="table-container animate-fade" *ngIf="openTitles.length > 0">
        <table class="custom-table">
          <thead>
            <tr>
              <th><input type="checkbox" (change)="toggleAll($event)"></th>
              <th>Documento</th>
              <th>Cliente</th>
              <th>Saldo</th>
              <th>Tipo de Baixa</th>
              <th>Valor (R$)</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let title of openTitles">
              <td><input type="checkbox" [(ngModel)]="title.selected"></td>
              <td><strong>{{ title.id.document }}</strong></td>
              <td>{{ title.customerName }}</td>
              <td class="text-danger"><strong>{{ title.remainingValue | currency: 'BRL' }}</strong></td>
              
              <td>
              <select [(ngModel)]="title.movementType" (change)="onTipoChange(title)">
                <option [value]="1">Baixa</option>
                <option [value]="3">Cancelamento</option>
              </select>
            </td>

            <td>
              <input type="number" 
                    [(ngModel)]="title.lowValue" 
                    class="input-valor">
            </td>
            </tr>
          </tbody>
        </table>

        <div class="action-footer" style="margin-top: 20px; text-align: right;">
          <button type="button" class="btn-save" (click)="processarBaixas()" style="padding: 10px 25px; cursor: pointer;">
            Confirmar Baixas em Lote
          </button>
        </div>
      </div>

      <p *ngIf="openTitles.length === 0" class="no-data">Nenhum título pendente encontrado.</p>
    </div>
  </main>
</div>
